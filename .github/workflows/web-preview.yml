# 把網頁版打包並發佈到 gh-pages 分支，讓沒有電腦時也能用手機瀏覽器預覽。
# 注意：這是網頁版，原生畫面（例如底部分頁）和 Expo Go 會有些差異。
name: Web preview

on:
  push:
    branches: [main, setup/expo-sdk57, feature/local-ai-teacher]
  workflow_dispatch:

permissions:
  contents: write

# 所有分支都寫入同一個 gh-pages，排隊依序部署，不中斷進行中的部署
concurrency:
  group: web-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # 功能分支只部署到 /<repo>/ai-preview/ 給手機實測，正式網站 /<repo>/ 不受影響
      PREVIEW_DIR: ${{ github.ref_name == 'feature/local-ai-teacher' && 'ai-preview' || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # expo-env.d.ts 平常由 `npx expo start` 自動產生（已被 .gitignore 排除），CI 需要自己建立
      - name: Generate Expo type declarations
        run: printf '/// <reference types="expo/types" />\n' > expo-env.d.ts

      - run: npx tsc --noEmit
      # 學習資料格式檢查（單字、注音、題目、文章圖片），有錯就不打包
      - run: npm run check:data

      # GitHub Pages 的網址是 https://<user>.github.io/<repo>/，所以只在打包時加上 baseUrl，
      # 不寫進 app.json，避免影響 Expo Go。
      - name: Set web base URL
        run: |
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const preview = process.env.PREVIEW_DIR ? "/" + process.env.PREVIEW_DIR : "";
            config.expo.experiments = { ...config.expo.experiments, baseUrl: "/${{ github.event.repository.name }}" + preview };
            fs.writeFileSync("app.json", JSON.stringify(config, null, 2));
          '

      # 網頁版保留日文、中文原字，JS 檔小一半（見 metro.config.js）
      - run: npx expo export --platform web --output-dir dist --clear
        env:
          WEB_KEEP_UNICODE: '1'
          # 讓 service worker 每次上架都重新快取新版本（見 src/lib/service-worker.web.ts）
          EXPO_PUBLIC_BUILD_ID: ${{ github.sha }}

      - name: Prepare Pages files
        run: |
          touch dist/.nojekyll
          if [ -f dist/+not-found.html ]; then cp dist/+not-found.html dist/404.html; fi

      - name: Push to gh-pages branch
        run: |
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$PREVIEW_DIR" ]; then
            # 預覽版：只替換 gh-pages 裡的預覽資料夾，其他檔案（正式網站）保持不變
            git clone -q --depth 1 -b gh-pages "$REPO_URL" pages
            rm -rf "pages/$PREVIEW_DIR"
            cp -r dist "pages/$PREVIEW_DIR"
            cd pages
            git add -A
            git diff --cached --quiet && exit 0
            git commit -q -m "Deploy $PREVIEW_DIR from ${GITHUB_SHA::7}"
            git push -q origin gh-pages
          else
            # 正式版：整個重新部署，但保留已存在的預覽資料夾
            if git clone -q --depth 1 -b gh-pages "$REPO_URL" old-pages && [ -d old-pages/ai-preview ]; then
              cp -r old-pages/ai-preview dist/ai-preview
            fi
            cd dist
            git init -q -b gh-pages
            git add -A
            git commit -q -m "Deploy web preview from ${GITHUB_SHA::7}"
            git push -f "$REPO_URL" gh-pages
          fi
